<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クールダウンワークアウトクロック</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-4 text-green-400">クールダウンワークアウトクロック</h1>
  <div class="flex flex-col lg:flex-row gap-4">
    <!-- Left: timer + progress -->
    <div class="lg:w-72 flex flex-col items-center gap-4">
      <div class="w-full bg-gray-900 rounded-xl border border-gray-700 p-4 flex flex-col items-center">
        <div id="exName" class="text-lg font-bold text-green-300 text-center mb-1">-</div>
        <div id="exTimer" class="text-6xl font-bold font-mono text-white my-2">00</div>
        <div id="exProgress" class="w-full h-2 bg-gray-700 rounded-full overflow-hidden">
          <div id="exBar" class="h-full bg-green-500 transition-all" style="width:0%"></div>
        </div>
        <div class="text-xs text-gray-500 mt-1" id="exCount">-</div>
      </div>
      <!-- Total progress -->
      <div class="w-full bg-gray-900 rounded-xl border border-gray-700 p-3">
        <div class="flex justify-between text-xs text-gray-400 mb-1">
          <span>全体進捗</span>
          <span id="totalTime">-</span>
        </div>
        <div class="w-full h-3 bg-gray-800 rounded-full overflow-hidden">
          <div id="totalBar" class="h-full bg-blue-600 transition-all" style="width:0%"></div>
        </div>
      </div>
      <!-- Controls -->
      <div class="flex gap-2 w-full">
        <button id="btnStart" aria-label="開始"
          class="flex-1 bg-green-700 hover:bg-green-600 text-white font-bold py-2 px-3 rounded-lg transition">
          ▶ 開始
        </button>
        <button id="btnPause" aria-label="一時停止" disabled
          class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-3 rounded-lg transition disabled:opacity-40">
          ⏸ 停止
        </button>
        <button id="btnReset" aria-label="リセット"
          class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-2 px-3 rounded-lg transition border border-gray-700">
          ↺
        </button>
      </div>
    </div>

    <!-- Right: routine list + edit -->
    <div class="flex-1 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-gray-300">ルーティン一覧</h2>
        <div class="flex gap-2">
          <button id="btnSave" aria-label="ルーティン保存"
            class="text-xs bg-blue-800 hover:bg-blue-700 text-blue-200 py-1 px-2 rounded transition">保存</button>
          <button id="btnLoad" aria-label="ルーティン読込"
            class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 py-1 px-2 rounded transition">読込</button>
        </div>
      </div>
      <div id="routineList" class="space-y-1 max-h-72 overflow-y-auto pr-1"></div>
      <!-- Add item form -->
      <div class="bg-gray-900 rounded-xl border border-gray-700 p-3">
        <p class="text-xs font-semibold text-gray-400 mb-2">種目を追加</p>
        <div class="flex gap-2">
          <input id="newName" type="text" placeholder="種目名（例：スクワット）" aria-label="種目名"
            class="flex-1 bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm text-gray-100 placeholder-gray-600">
          <input id="newSecs" type="number" placeholder="秒" min="5" max="300" value="30" aria-label="秒数"
            class="w-16 bg-gray-800 border border-gray-600 rounded px-2 py-2 text-sm text-gray-100 text-center">
          <button id="btnAdd" aria-label="種目追加"
            class="bg-green-800 hover:bg-green-700 text-green-200 font-bold py-2 px-3 rounded transition text-sm">
            ＋
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
const DEFAULT_ROUTINE = [
  { name: '大腿四頭筋ストレッチ', secs: 30 },
  { name: 'ハムストリングス', secs: 30 },
  { name: 'ヒップフレクサー', secs: 30 },
  { name: 'カーフストレッチ', secs: 30 },
  { name: '肩甲骨回し', secs: 20 },
  { name: '胸・肩ストレッチ', secs: 30 },
  { name: '体側伸ばし', secs: 20 },
  { name: '深呼吸 & リラックス', secs: 30 },
];

let routine = [...DEFAULT_ROUTINE];
let currentIdx = 0, remainSecs = 0, elapsed = 0, totalSecs = 0;
let timerInterval = null, running = false, paused = false;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq = 880, dur = 0.15) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'square'; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + dur);
}

function calcTotal() { return routine.reduce((s, r) => s + r.secs, 0); }

function renderList() {
  const list = document.getElementById('routineList');
  list.innerHTML = '';
  routine.forEach((item, i) => {
    const div = document.createElement('div');
    const isCurrent = running && i === currentIdx;
    const isDone = running && i < currentIdx;
    div.className = `flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition ${
      isCurrent ? 'bg-green-900 border border-green-600' :
      isDone ? 'bg-gray-900 opacity-50' : 'bg-gray-800'
    }`;
    div.innerHTML = `
      <span class="w-5 text-center ${isDone ? 'text-green-500' : isCurrent ? 'text-green-300' : 'text-gray-500'}">${isDone ? '✓' : isCurrent ? '▶' : String(i+1)}</span>
      <span class="flex-1 ${isCurrent ? 'text-green-200 font-bold' : 'text-gray-200'}">${esc(item.name)}</span>
      <span class="text-gray-400 font-mono w-8 text-right">${item.secs}s</span>
      ${!running ? `
        <button onclick="moveUp(${i})" aria-label="上へ" class="text-gray-600 hover:text-gray-300 px-1" ${i===0?'disabled':''}>↑</button>
        <button onclick="moveDown(${i})" aria-label="下へ" class="text-gray-600 hover:text-gray-300 px-1" ${i===routine.length-1?'disabled':''}>↓</button>
        <button onclick="removeItem(${i})" aria-label="削除" class="text-red-700 hover:text-red-500 px-1">×</button>
      ` : ''}
    `;
    list.appendChild(div);
  });
  totalSecs = calcTotal();
  document.getElementById('totalTime').textContent = `合計 ${totalSecs}秒`;
}

window.removeItem = (i) => { routine.splice(i, 1); renderList(); };
window.moveUp = (i) => { if (i > 0) { [routine[i-1], routine[i]] = [routine[i], routine[i-1]]; renderList(); } };
window.moveDown = (i) => { if (i < routine.length-1) { [routine[i+1], routine[i]] = [routine[i], routine[i+1]]; renderList(); } };

function startExercise(idx) {
  if (idx >= routine.length) {
    finishAll(); return;
  }
  currentIdx = idx;
  remainSecs = routine[idx].secs;
  document.getElementById('exName').textContent = routine[idx].name;
  document.getElementById('exCount').textContent = `${idx+1} / ${routine.length}`;
  renderList();
  updateExDisplay();
}

function updateExDisplay() {
  document.getElementById('exTimer').textContent = String(remainSecs).padStart(2, '0');
  const pct = ((routine[currentIdx].secs - remainSecs) / routine[currentIdx].secs) * 100;
  document.getElementById('exBar').style.width = pct + '%';
  const totalPct = (elapsed / totalSecs) * 100;
  document.getElementById('totalBar').style.width = totalPct + '%';
  document.getElementById('totalTime').textContent = `${elapsed}s / ${totalSecs}s`;
}

function finishAll() {
  clearInterval(timerInterval); running = false;
  document.getElementById('exName').textContent = 'クールダウン完了！';
  document.getElementById('exTimer').textContent = '🎉';
  document.getElementById('exBar').style.width = '100%';
  document.getElementById('totalBar').style.width = '100%';
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  beep(660, 0.2); setTimeout(() => beep(880, 0.3), 200);
}

document.getElementById('btnStart').addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (routine.length === 0) return;
  running = true; paused = false; elapsed = 0;
  totalSecs = calcTotal();
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = false;
  startExercise(0);
  timerInterval = setInterval(() => {
    if (!running || paused) return;
    remainSecs--; elapsed++;
    if (remainSecs <= 3 && remainSecs > 0) beep(1200, 0.08);
    if (remainSecs <= 0) {
      beep(880, 0.2);
      startExercise(currentIdx + 1);
    } else {
      updateExDisplay();
    }
  }, 1000);
});

document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? '▶ 再開' : '⏸ 停止';
});

document.getElementById('btnReset').addEventListener('click', () => {
  clearInterval(timerInterval); running = false; paused = false;
  currentIdx = 0; elapsed = 0;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnPause').textContent = '⏸ 停止';
  document.getElementById('exName').textContent = '-';
  document.getElementById('exTimer').textContent = '00';
  document.getElementById('exBar').style.width = '0%';
  document.getElementById('totalBar').style.width = '0%';
  totalSecs = calcTotal();
  document.getElementById('totalTime').textContent = `合計 ${totalSecs}秒`;
  document.getElementById('exCount').textContent = '-';
  renderList();
});

document.getElementById('btnAdd').addEventListener('click', () => {
  const name = document.getElementById('newName').value.trim();
  const secs = parseInt(document.getElementById('newSecs').value);
  if (!name || isNaN(secs) || secs < 1) return;
  routine.push({ name, secs });
  document.getElementById('newName').value = '';
  document.getElementById('newSecs').value = 30;
  renderList();
});

document.getElementById('btnSave').addEventListener('click', () => {
  localStorage.setItem('cooldown-routine', JSON.stringify(routine));
  document.getElementById('btnSave').textContent = '保存済✓';
  setTimeout(() => { document.getElementById('btnSave').textContent = '保存'; }, 1500);
});

document.getElementById('btnLoad').addEventListener('click', () => {
  const saved = localStorage.getItem('cooldown-routine');
  if (saved) { routine = JSON.parse(saved); renderList(); }
});

renderList();
</script>
</body>
</html>
